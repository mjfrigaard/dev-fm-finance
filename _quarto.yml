project:
  type: website
  render:
    - "*.qmd"

website:
  title: "DEV (fm-finance)"
  reader-mode: true
  repo-url: https://github.com/mjfrigaard/dev-fm-finance
  page-navigation: true
  sidebar:
    style: docked
    search: true
    tools:
      - icon: github
        href: https://github.com/mjfrigaard/dev-fm-finance
    contents:
      - index.qmd
      - section: "Foundations"
        contents:
          - income.qmd
          - tracking_spending.qmd
          - budgeting.qmd
          - managing_debt.qmd
          - emergency_fund.qmd
      - section: "Savings"
        contents:
          - savings_strategies.qmd
          - high_yield_accounts.qmd
          - automating_savings.qmd
      - section: "Investing"
        contents:
          - investing_basics.qmd
          - retirement_accounts.qmd
          - index_funds.qmd
          - asset_allocation.qmd
      - section: "Taxes & Insurance"
        contents:
          - taxes.qmd
          - insurance.qmd
      - section: "Planning"
        contents:
          - financial_goals.qmd
          - major_purchases.qmd
          - estate_planning.qmd
      - section: "Resources"
        contents:
          - r_vs_py.qmd

format:
  live-html:
    theme:
      light: [flatly, custom.scss, terminal.scss, light.scss]
      dark: [darkly, custom.scss, terminal.scss, dark.scss]
    highlight-style:
      light: arrow
      dark: monokai
    toc: true
    toc-depth: 5
    toc-location: right
    toc-expand: 3
    toc-title: Contents
    code-link: false
    code-block-border-left: "#99bbc9"
    code-annotations: hover
    number-sections: true
    callout-appearance: simple
    code-fold: show
    code-summary: 'show/hide'
    df-print: tibble
    dpi: 320
    fig-format: retina
    lightbox: true
    fig-asp: 0.618
    fontsize: 1.010em
    linestretch: 1.30

bibliography: references.bib

execute:
  freeze: auto

knitr: 
  opts_chunk:
    collapse: true
    comment: "# "